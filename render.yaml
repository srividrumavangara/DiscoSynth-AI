services:
  # Backend API service
  - type: web
    name: discosynth-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: discosynth-db
          property: connectionString
      - key: LLM_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app"

databases:
  # Managed PostgreSQL database
  - name: discosynth-db
    region: oregon
    plan: free
    databaseName: discosynth
    user: discosynth_admin
