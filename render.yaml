services:
  # Backend API service on Render connected to Supabase PostgreSQL
  - type: web
    name: discosynth-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false # Set to Supabase Transaction Pooler URI (postgresql://postgres.[ref]:[pwd]@aws-0-[region].pooler.supabase.com:6543/postgres)
      - key: SUPABASE_URL
        sync: false # e.g. https://[ref].supabase.co
      - key: SUPABASE_JWT_SECRET
        sync: false # Found in Supabase Settings -> API -> JWT Secret
      - key: LLM_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false # Optional: Google Gemini API Key for AI-assisted scenarios
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app"
