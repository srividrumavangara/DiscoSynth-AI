version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: discosynth
      POSTGRES_PASSWORD: discosynth_secret
      POSTGRES_DB: discosynth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discosynth"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://discosynth:discosynth_secret@db:5432/discosynth
      LLM_PROVIDER: mock
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:80"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
